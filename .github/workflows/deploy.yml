name: Deploy to Cloud Run

on:
  # Auto-deploy on push to main, but only when something that actually ends up
  # in this service's image changes. Without the paths filter every commit --
  # including docs-only and infra-only ones, and anything under explore/ --
  # would redeploy this service for no reason.
  #
  # Keep this list in sync with what ../../Dockerfile pulls in: the build stage
  # runs `vite build` (src, public, index.html, vite.config.js, and api/, which
  # vite.config.js imports from) and the runtime stage copies server.js + api/.
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "api/**"
      - "index.html"
      - "vite.config.js"
      - "server.js"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Required for keyless auth to GCP via Workload Identity Federation.
permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: ${{ vars.GCP_SERVICE_NAME }}
      AR_REPO: ${{ vars.GCP_AR_REPO }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/${SERVICE}"
          docker build -t "${IMAGE}:${GITHUB_SHA}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE}" \
            --image "${IMAGE}:${GITHUB_SHA}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --quiet
