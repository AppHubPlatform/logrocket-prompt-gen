name: Deploy to Cloud Run

on:
  # Every push to main that touches this service ships it to production. Merging is the
  # deploy, so anything that should not be live yet stays on a branch until it is ready.
  #
  # An allowlist rather than an exclusion list, because this repo holds a second service.
  # explore/ has its own image, its own workflow and its own domain, so a quest-game merge
  # must not roll out a new revision of the prompt generator. Anything not listed here,
  # including README files and Terraform, cannot change the image this workflow builds.
  push:
    branches: [main]
    paths:
      - "src/**"
      - "api/**"
      - "public/**"
      - "index.html"
      - "server.js"
      - "vite.config.js"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - ".dockerignore"
      # Included on purpose: a change to this workflow should prove itself by running,
      # rather than staying untested until the next code change.
      - ".github/workflows/deploy.yml"
  # Kept so a deploy can still be re-run by hand without an empty commit: rolling
  # forward after a transient failure, or redeploying when only a secret changed.
  workflow_dispatch:

# Required for keyless auth to GCP via Workload Identity Federation.
permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: ${{ vars.GCP_SERVICE_NAME }}
      AR_REPO: ${{ vars.GCP_AR_REPO }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/${SERVICE}"
          docker build -t "${IMAGE}:${GITHUB_SHA}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE}" \
            --image "${IMAGE}:${GITHUB_SHA}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --quiet
