<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explore LogRocket</title>
<meta name="description" content="Interactive tools and assessments from LogRocket.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root{
    --void:#07031d;
    --panel:#140b3c;
    --line:#3a2470;
    --purple-bright:#a78bfa;
    --cream:#f4eeff;
    --muted:#b6a8dd;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--void);
    color:var(--cream);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    line-height:1.5;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
  }

  main{max-width:640px;width:100%;}
  h1{font-size:clamp(28px,5vw,40px);margin:0 0 12px;letter-spacing:-0.02em;}
  .lede{color:var(--muted);margin:0 0 32px;font-size:17px;}

  ul{list-style:none;margin:0;padding:0;}
  li + li{margin-top:12px;}

  a.card{
    display:block;
    padding:20px 22px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    color:var(--cream);
    text-decoration:none;
    transition:border-color .15s ease,transform .15s ease;
  }
  a.card:hover,a.card:focus-visible{
    border-color:var(--purple-bright);
    transform:translateY(-2px);
  }
  a.card:focus-visible{outline:2px solid var(--purple-bright);outline-offset:3px;}
  .card-title{font-weight:600;font-size:18px;margin-bottom:4px;}
  .card-desc{color:var(--muted);font-size:15px;}

  footer{margin-top:40px;font-size:14px;color:var(--muted);}
  footer a{color:var(--purple-bright);}

  @media (prefers-reduced-motion:reduce){
    a.card{transition:none;}
    a.card:hover,a.card:focus-visible{transform:none;}
  }
</style>
</head>
<body>

<main>
  <h1>Explore LogRocket</h1>
  <p class="lede">Interactive tools and assessments for teams who care about what their users actually experience.</p>

  <ul>
    <li>
      <a class="card" href="/monitoring-maturity-quest">
        <div class="card-title">Monitoring Maturity Quest</div>
        <div class="card-desc">An interactive assessment of how mature your frontend monitoring practice is.</div>
      </a>
    </li>
  </ul>

  <footer>
    <a href="https://logrocket.com">logrocket.com</a>
  </footer>
</main>

</body>
</html>
